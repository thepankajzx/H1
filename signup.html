<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up | Premium Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            /* Dark Theme (Default) */
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-surface-hover: #171717;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-tertiary: #52525b;
            
            --primary: #ffffff;
            --primary-invert: #000000;
            --accent-1: #3b82f6;
            
            --danger: #ef4444;
            
            --shadow-md: 0 8px 24px rgba(0,0,0,0.6);
            
            --radius-md: 12px;
            --radius-lg: 16px;
            
            --transition-fast: 0s;
            --transition-smooth: 0s;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f5f9;
            
            --border-subtle: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.12);
            
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            
            --primary: #0f172a;
            --primary-invert: #ffffff;
            
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 15% 0%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 85% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        a { color: var(--primary); text-decoration: none; transition: var(--transition-fast); }
        a:hover { opacity: 0.8; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            transition: transform var(--transition-fast);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input {
            margin-top: 0.25rem;
            accent-color: var(--primary);
        }

        .checkbox-group label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: transform var(--transition-fast);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-invert);
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-google {
            background: var(--bg-base);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
        }
        .btn-google:hover {
            background: var(--bg-surface-hover);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            font-weight: 500;
        }
        
        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Start tracking your habits today</p>
        </div>

        <div class="error-message" id="errorMessage">Please fill all fields correctly.</div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-input" placeholder="John Doe" required autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
            </div>

            <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
        </form>

        <div class="divider">or</div>

        <button class="btn btn-google" id="googleSignupBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
        </button>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        const htmlElement = document.documentElement;
        if(localStorage.getItem('theme') === 'light') {
            htmlElement.setAttribute('data-theme', 'light');
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
        }
    </script>
    
    <!-- Auth Logic -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module">
        const signupForm = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');
        const googleSignupBtn = document.getElementById('googleSignupBtn');
        const errorMessage = document.getElementById('errorMessage');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termsCheckbox = document.getElementById('terms');

        const setLoading = (btn, isLoading, originalText) => {
            if (isLoading) {
                btn.disabled = true;
                btn.style.opacity = '0.7';
                btn.innerHTML = `<span class="loader" style="display:inline-block; width:16px; height:16px; border:2px solid currentColor; border-bottom-color:transparent; border-radius:50%; animation:rotation 1s linear infinite;"></span>`;
            } else {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = originalText;
            }
        };

        const showError = (msg) => {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
        };

        const hideError = () => {
            errorMessage.style.display = 'none';
        };

        const checkProfileAndRedirect = async (user) => {
            try {
                const userDocRef = window.doc(window.firebaseDb, "users", user.uid);
                const userDoc = await window.getDoc(userDocRef);
                if (userDoc.exists()) {
                    window.location.href = 'index.html'; // Dashboard
                } else {
                    window.location.href = 'profile.html'; // Profile setup
                }
            } catch (error) {
                console.error("Error checking profile:", error);
                showError("Error checking profile. Please try again.");
            }
        };

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!termsCheckbox.checked) {
                showError("You must agree to the Terms of Service and Privacy Policy.");
                return;
            }

            if (password !== confirmPassword) {
                showError("Passwords do not match.");
                return;
            }

            if (password.length < 6) {
                showError("Password should be at least 6 characters.");
                return;
            }

            const originalBtnHtml = signupBtn.innerHTML;
            setLoading(signupBtn, true, originalBtnHtml);

            try {
                const userCredential = await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                // Also store the full name somewhere temporarily or update user profile?
                // Firebase Auth updateProfile could be used, but since we create a profile doc later, we can store it in localStorage for now
                localStorage.setItem('tempFullName', fullName);
                
                await checkProfileAndRedirect(userCredential.user);
            } catch (error) {
                console.error("Signup error:", error);
                if (error.code === 'auth/email-already-in-use') {
                    showError("Email is already in use. Please log in.");
                } else if (error.code === 'auth/invalid-email') {
                    showError("Invalid email format.");
                } else {
                    showError(error.message);
                }
                setLoading(signupBtn, false, originalBtnHtml);
            }
        });

        googleSignupBtn.addEventListener('click', async () => {
            hideError();
            const originalBtnHtml = googleSignupBtn.innerHTML;
            setLoading(googleSignupBtn, true, originalBtnHtml);

            try {
                const userCredential = await window.signInWithPopup(window.firebaseAuth, window.googleProvider);
                await checkProfileAndRedirect(userCredential.user);
            } catch (error) {
                console.error("Google signup error:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError("Google sign-up failed. Please try again.");
                }
                setLoading(googleSignupBtn, false, originalBtnHtml);
            }
        });
    </script>
    <style>
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
